<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ronda 9º GAC</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://raw.githack.com/eKoopmans/html2pdf/master/dist/html2pdf.bundle.js"></script>
  <script src="script.js" defer></script>
  <link rel="icon" href="imagens/9gac.gif" type="image/x-icon">
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="imagens/9gac.gif" alt="Logo 9º GAC">
    </div>

    <!-- Tela 1 - Login -->
    <div id="tela1">
      <h2>Acesse a Ronda</h2>
      <input type="text" placeholder="Identidade" id="login">
      <input type="password" placeholder="Senha" id="senha">
      <button onclick="login()">Continuar</button>
      <button onclick="mostrarTela('tela2')">Primeiro acesso?</button>
    </div>

    <!-- Tela 2 - Cadastro -->
  <!-- Tela 2 - Cadastro -->
<div id="tela2" class="hidden">
  <h2>Faça seu cadastro</h2>
 <input type="text" id="cadIdentidade" placeholder="Identidade Militar">
<input type="password" id="cadSenha" placeholder="Senha">
<input type="password" id="cadConfirmaSenha" placeholder="Confirme a Senha">

<select id="cadFuncao">
  <option value="">Selecione sua função</option>
  <option value="Of de Dia">Of de Dia</option>
  <option value="Adj Of Dia">Adj Of Dia</option>
  <option value="Sgt Dia ALA">Sgt Dia ALA</option>
  <option value="Sgt Dia BC">Sgt Dia BC</option>
</select>

  <button onclick="cadastrar()">Cadastrar</button>
  <button onclick="mostrarTela('tela1')">Voltar</button>
</div>

    <!-- Tela 4 - Postos -->
    <div id="tela4" class="hidden">
      <h2>Postos</h2>
      <button onclick="iniciarLeitura('POSTO_P1')">P1</button>
      <button onclick="iniciarLeitura('POSTO_P2')">P2</button>
      <button onclick="iniciarLeitura('POSTO_P3')">P3</button>
      <button onclick="iniciarLeitura('POSTO_P4')">P4</button>
      <button onclick="iniciarLeitura('POSTO_P5')">P5</button>
      <button onclick="iniciarLeitura('PAIOL_1')">Paiol 1</button>
      <button onclick="iniciarLeitura('PAIOL_2')">Paiol 2</button>
      <button onclick="iniciarLeitura('ARMARIA_BC')">Armaria BC</button>
      <button onclick="iniciarLeitura('ARMARIA_1')">Armaria 1°</button>
      <button onclick="iniciarLeitura('ARMARIA_2')">Armaria 2°</button>
      <button onclick="mostrarTela('tela8')">Gerar Formulário</button>
    </div>

    <!-- Tela 5 - QR Code -->
    <div id="tela5" class="hidden">
      <h2>Leia o QR Code</h2>
      <div id="reader" style="width: 100%; max-width: 300px; margin: auto;"></div>
      <div id="resultado" class="info-box">Aguardando leitura...</div>
      <button onclick="stopScan()">Cancelar</button>
    </div>

    <!-- Tela 6 - Sucesso -->
    <div id="tela6" class="hidden">
      <h2>QR Code lido com êxito</h2>
      <button onclick="mostrarTela('tela4')">Continuar</button>
    </div>

    <!-- Tela 8 - Formulário Final -->
    <div id="tela8" class="hidden">
      <h2>Relatório da Ronda</h2>
      <div class="info-box">P1: <span id="p1info">---</span></div>
      <div class="info-box">P2: <span id="p2info">---</span></div>
      <div class="info-box">P3: <span id="p3info">---</span></div>
      <div class="info-box">P4: <span id="p4info">---</span></div>
      <div class="info-box">P5: <span id="p5info">---</span></div>
      <div class="info-box">Paiol 1: <span id="paiol1info">---</span></div>
      <div class="info-box">Paiol 2: <span id="paiol2info">---</span></div>
      <div class="info-box">Armaria BC: <span id="armariabcinfo">---</span></div>
      <div class="info-box">Armaria 1°: <span id="armaria1info">---</span></div>
      <div class="info-box">Armaria 2°: <span id="armaria2info">---</span></div>
      <div class="info-box"><strong>Duração total:</strong> <span id="tempoTotal">---</span></div>
      <button onclick="finalizarRonda()">Finalizar Ronda</button>
      <button onclick="gerarExcel()">Exportar Excel Local</button>
    </div>
  </div>
</body>
</html>
